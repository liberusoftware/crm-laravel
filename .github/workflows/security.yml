name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  DB_DATABASE: liberu
  DB_USERNAME: liberu
  DB_PASSWORD: secret

jobs:

  phpcpd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
      - name: 'Run Phpcpd'
        run: |
          composer install
          test -f phpcpd.phar || curl -L https://phar.phpunit.de/phpcpd.phar -o phpcpd.phar
          php phpcpd.phar app/ --exclude app/Http/Livewire/CallManager.php --exclude app/Services/GmailService.php --exclude app/Filament/App/Resources/AdResource.php --exclude app/Filament/App/Resources/MessageResource.php --exclude app/Http/Responses/LoginResponse.php --exclude app/Http/Controllers/Api/ContactController.php

  php-insights:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
      - name: 'Run php-insight'
        run: |
          composer install
          composer analyse -- --no-progress

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
      - name: Audit locked Composer dependencies
        run: composer audit --locked --no-interaction
