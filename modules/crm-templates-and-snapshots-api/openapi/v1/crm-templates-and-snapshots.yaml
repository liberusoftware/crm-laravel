info: {title: CRM Templates and Snapshots API, version: 1.0.0}
paths:
  /api/v1/crm/templates-and-snapshots: {get: {operationId: crm.templates.and.snapshots.list, responses: {'200': {description: Snapshots}}}, post: {operationId: crm.templates.and.snapshots.create, parameters: [{name: Idempotency-Key, in: header, schema: {type: string}}], responses: {'201': {description: Snapshot}}}}
