openapi: 3.1.0
info:
  title: CRM CPQ API
  version: 1.0.0
paths:
  /api/v1/crm/cpq/quotes:
    get:
      operationId: crm.cpq.list
      security: [{ sanctum: [] }]
      parameters: [{ name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }]
      responses: { '200': { $ref: '#/components/responses/QuoteCollection' } }
    post:
      operationId: crm.cpq.create
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } }
      responses: { '201': { $ref: '#/components/responses/Quote' } }
  /api/v1/crm/cpq/quotes/{quote}:
    parameters: [{ name: quote, in: path, required: true, schema: { type: string } }]
    get:
      operationId: crm.cpq.get
      security: [{ sanctum: [] }]
      responses: { '200': { $ref: '#/components/responses/Quote' }, '404': { $ref: '#/components/responses/Problem' } }
  /api/v1/crm/cpq/quotes/{quote}/submit:
    post:
      operationId: crm.cpq.submit
      security: [{ sanctum: [] }]
      parameters: [{ name: quote, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Approval' } }
components:
  securitySchemes: { sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum } }
  schemas:
    QuoteRequest:
      type: object
      required: [lines]
      properties:
        name: { type: string, maxLength: 255 }
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }
        configuration: { type: object, additionalProperties: true }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [unit_price, quantity]
            properties:
              description: { type: string }
              unit_price: { type: number, minimum: 0 }
              quantity: { type: number, exclusiveMinimum: 0 }
              discount: { type: number, minimum: 0 }
    Quote:
      type: object
      required: [id, type, attributes]
      properties:
        id: { type: string }
        type: { const: crm-cpq-quote, type: string }
        attributes: { $ref: '#/components/schemas/QuoteRequest' }
    Approval:
      type: object
      properties:
        id: { type: string }
        type: { const: crm-cpq-approval, type: string }
        attributes:
          type: object
          properties: { status: { type: string }, quote_id: { type: string } }
    Problem:
      type: object
      required: [title, status]
      properties: { title: { type: string }, detail: { type: string }, status: { type: integer } }
  responses:
    Quote: { description: CPQ quote, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Quote' } } } } } }
    QuoteCollection: { description: Paginated CPQ quotes, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Quote' } } } } } } }
    Approval: { description: Quote approval, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Approval' } } } } } }
    Problem: { description: RFC 9457 problem details, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
