openapi: 3.1.0
info: {title: CRM Work Management API, version: 1.0.0}
paths:
  /api/v1/crm/work-management:
    get: {operationId: crm.work.management.list, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/PageSize'}, {'$ref': '#/components/parameters/Status'}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: crm.work.management.create, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemInput'}}}}, responses: {'201': {$ref: '#/components/responses/WorkItem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/crm/work-management/{workItem}:
    get: {operationId: crm.work.management.get, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/WorkItem'}], responses: {'200': {$ref: '#/components/responses/WorkItem'}}}
    patch: {operationId: crm.work.management.update, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/WorkItem'}, {'$ref': '#/components/parameters/IfMatch'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemPatch'}}}}, responses: {'200': {$ref: '#/components/responses/WorkItem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/crm/work-management/{workItem}/complete: {post: {operationId: crm.work.management.complete, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/WorkItem'}, {'$ref': '#/components/parameters/IfMatch'}, {'$ref': '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/WorkItem'}}}}
  /api/v1/crm/work-management/{workItem}/checklist: {post: {operationId: crm.work.management.checklist.create, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/WorkItem'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [title], properties: {title: {type: string, maxLength: 200}}}}}}, responses: {'201': {description: Checklist item}}}}
  /api/v1/crm/work-management/{workItem}/approvals: {post: {operationId: crm.work.management.approval.request, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/WorkItem'}, {'$ref': '#/components/parameters/IdempotencyKey'}], responses: {'201': {description: Approval}}}}
  /api/v1/crm/work-management/{workItem}/dependencies: {post: {operationId: crm.work.management.dependency.create, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/WorkItem'}], responses: {'201': {description: Dependency}}}}
  /api/v1/crm/work-management/queues: {get: {operationId: crm.work.management.queues.list, security: [{sanctum: []}], responses: {'200': {description: Queues}}}, post: {operationId: crm.work.management.queue.create, security: [{sanctum: []}], parameters: [{'$ref': '#/components/parameters/IdempotencyKey'}], responses: {'201': {description: Queue}}}}
  /api/v1/crm/work-management/workload: {get: {operationId: crm.work.management.workload, security: [{sanctum: []}], responses: {'200': {description: Workload report}}}}
components:
  parameters:
    WorkItem: {name: workItem, in: path, required: true, schema: {type: integer, minimum: 1}}
    PageSize: {name: page[size], in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Status: {name: status, in: query, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
    IfMatch: {name: If-Match, in: header, schema: {type: string}}
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    WorkItemInput: {type: object, required: [title], properties: {title: {type: string, maxLength: 200}, description: {type: string, nullable: true}, assigned_to: {type: integer, nullable: true}, queue_id: {type: integer, nullable: true}, priority: {type: string, enum: [low, normal, high, urgent]}, subject_type: {type: string, nullable: true}, subject_id: {type: integer, nullable: true}, due_at: {type: string, format: date-time, nullable: true}, recurrence: {type: string, nullable: true}, metadata: {type: object, nullable: true}}}
    WorkItemPatch: {type: object, properties: {title: {type: string, maxLength: 200}, description: {type: [string, 'null']}, assigned_to: {type: [integer, 'null'], minimum: 1}, queue_id: {type: [integer, 'null'], minimum: 1}, status: {type: string, enum: [pending, in_progress, blocked, completed, cancelled]}, priority: {type: string, enum: [low, normal, high, urgent]}, due_at: {type: [string, 'null'], format: date-time}, metadata: {type: [object, 'null']}}}
    WorkItem: {type: object, required: [id, type, attributes], properties: {id: {type: string}, type: {const: crm-work-item}, attributes: {type: object, additionalProperties: true}}}
    Problem: {type: object, required: [type, title, status], properties: {type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}}}
  responses:
    WorkItem: {description: Work item, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/WorkItem'}}}}}}
    Collection: {description: Authorized paginated work items, content: {application/json: {schema: {type: object, properties: {data: {type: array}, meta: {type: object}, links: {type: object}}}}}}
    Problem: {description: RFC 9457 problem, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
